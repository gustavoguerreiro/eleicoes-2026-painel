# Produção: o painel só escuta em 127.0.0.1:8765; quem atende o público é o nginx do servidor (deploy/nginx).
services:
  painel:
    build: .
    image: eleicoes-painel:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTA:-8765}:8765"        # PORTA só serve para testar ao lado de outro painel na mesma máquina
    environment:
      CONFIAR_PROXY: "1"            # o nginx entrega o IP real do visitante em X-Forwarded-For
      TZ: America/Sao_Paulo
    env_file:
      - path: .env                  # opcional (só tem a chave da Anthropic, e o chat fica desligado no modo público)
        required: false
    volumes:
      - logs:/app/logs              # histórico do gráfico (historico_2t.json): sobrevive a reinício e a deploy
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  logs:

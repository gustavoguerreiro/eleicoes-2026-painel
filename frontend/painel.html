<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração 2026</title>
<script>try{var t=localStorage.getItem("tema");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>/* Apuração 2026 — tokens (cole no <style> do painel.html) */
:root {
  /* Tipografia — só pilha do sistema */
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs-cap: 13px;      /* mínimo para qualquer texto (antes 11px) */
  --fs-sm: 14px;
  --fs-body: 15px;
  --fs-lg: 17px;
  --fs-h3: 18px;       /* título de cartão */
  --fs-h2: 22px;
  --fs-h1: 28px;       /* título de página */
  --fs-num: clamp(30px, 9cqi, 46px); /* % do duelo, escala com o cartão */
  --fw-reg: 400; --fw-med: 600; --fw-bold: 700; --fw-black: 800;
  --lh-tight: 1.15; --lh-body: 1.5;
  --num: tabular-nums; /* font-variant-numeric em todo número */

  /* Forma e espaço */
  --r-card: 14px; --r-box: 10px; --r-chip: 6px; --r-pill: 999px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  --max: 1180px; --bp-mobile: 620px;

  /* Partidos — cor "pura" (mapas, barras, hemiciclos) */
  --p-pt: #dc2626; --p-pl: #16a34a; --p-uniao: #3b82f6; --p-pp: #1e3a8a;
  --p-republicanos: #6366f1; --p-psd: #0d9488; --p-mdb: #eab308; --p-pode: #06b6d4;
  --p-psb: #f97316; --p-psol: #c2185b; --p-psdb: #0369a1; --p-pdt: #0ea5e9;
  --p-novo: #c2410c; --p-avante: #7c3aed; --p-pv: #84cc16; --p-rede: #10b981;
  --p-pcdob: #9f1239; --p-cidadania: #ec4899; --p-solidariedade: #f59e0b;
  --p-prd: #6b7280; --p-missao: #374151; --p-up: #be123c; --p-pstu: #9f1239;

  /* Partidos — fundo do selo/avatar com texto branco (todos ≥ 4,5:1) */
  --p-pt-chip: #b91c1c;            /* 6,5 */
  --p-pl-chip: #15803d;            /* 5,0  (era 3,30) */
  --p-uniao-chip: #1d4ed8;         /* 6,7  (era 3,68) */
  --p-pp-chip: #1e3a8a;
  --p-republicanos-chip: #4f46e5;  /* 6,3  (era 4,47) */
  --p-psd-chip: #0f766e;           /* 5,5  (era 3,74) */
  --p-mdb-chip: #854d0e;           /* 7,0  (era 1,92) */
  --p-pode-chip: #0e7490;          /* 5,4  (era 2,43) */
  --p-psb-chip: #c2410c;           /* 5,2  (era 2,80) */
  --p-psol-chip: #c2185b;
  --p-psdb-chip: #0369a1;
  --p-pdt-chip: #0369a1;           /* 5,9  (era 2,77) */
  --p-novo-chip: #c2410c;
  --p-avante-chip: #7c3aed;
  --p-pv-chip: #3f6212;            /* 7,4  (era 1,98) */
  --p-rede-chip: #047857;          /* 5,5  (era 2,54) */
  --p-pcdob-chip: #9f1239;
  --p-cidadania-chip: #be185d;     /* 6,0  (era 3,53) */
  --p-solidariedade-chip: #92400e; /* 7,0  (era 2,15) */
  --p-prd-chip: #4b5563;
  --p-missao-chip: #374151;
  --p-up-chip: #be123c;
  --p-pstu-chip: #9f1239;
}

:root, [data-theme="light"] {
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #eef0f4;
  --ink: #14171f; --ink-2: #465063; --ink-3: #5b6477; /* ink-3 = 5,9:1 no branco */
  --line: #dfe3ea; --track: #e4e7ed;
  --acc: #1f4fc4; --acc-ink: #ffffff; --acc-soft: #e7edfb;   /* 6,9:1 */
  --ok: #14703a; --ok-soft: #e4f3e9;
  --warn: #9a4a07; --warn-soft: #fbefe1;
  --info: #1f4fc4; --info-soft: #e7edfb;
  --bad: #b42318; --bad-soft: #fdeceb;
  --flash: #fff1a8;
  --n-elim: #7d8596; --n-branco: #c3c8d1; --n-nulo: #a1a8b5;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
}

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0e14; --surface: #141922; --surface-2: #1b212c;
  --ink: #edf0f5; --ink-2: #b4bccb; --ink-3: #98a2b3;
  --line: #262e3c; --track: #252d3b;
  --acc: #7aa5ff; --acc-ink: #0b1220; --acc-soft: #1a2540;   /* texto escuro no azul: 8,1:1 (era 2,7) */
  --ok: #4ade80; --ok-soft: #12261a;
  --warn: #fbbf24; --warn-soft: #2a2010;
  --info: #7aa5ff; --info-soft: #18213a;
  --bad: #f87171; --bad-soft: #2c1618;
  --flash: #4a3e00;
  --n-elim: #6b7383; --n-branco: #a9b0bd; --n-nulo: #868e9c;
  --shadow: none;
} }
[data-theme="dark"] {
  --bg: #0b0e14; --surface: #141922; --surface-2: #1b212c;
  --ink: #edf0f5; --ink-2: #b4bccb; --ink-3: #98a2b3;
  --line: #262e3c; --track: #252d3b;
  --acc: #7aa5ff; --acc-ink: #0b1220; --acc-soft: #1a2540;
  --ok: #4ade80; --ok-soft: #12261a;
  --warn: #fbbf24; --warn-soft: #2a2010;
  --info: #7aa5ff; --info-soft: #18213a;
  --bad: #f87171; --bad-soft: #2c1618;
  --flash: #4a3e00;
  --n-elim: #6b7383; --n-branco: #a9b0bd; --n-nulo: #868e9c;
  --shadow: none;
}

/* aliases dos nomes antigos: as telas do 1º turno ainda usam estes nomes */
:root{--card:var(--surface);--soft:var(--surface-2);--tx:var(--ink);--mut:var(--ink-3);--bd:var(--line);--bar:var(--track);--sh:var(--shadow)}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs-body)/var(--lh-body) var(--font-sans);-webkit-font-smoothing:antialiased;font-variant-numeric:var(--num)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}

/* ---- cabeçalho ---- */
header.site{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top{max-width:var(--max);margin:0 auto;padding:14px 24px 0;display:flex;align-items:center;gap:20px}
.marca{display:flex;align-items:center;gap:10px}
.logo{width:22px;height:22px;border-radius:6px;overflow:hidden;display:flex;gap:2px;background:var(--surface)}
.logo i{flex:1;background:var(--ink)}.logo i+i{background:var(--ink-3)}
.marca{flex:none}
.marca .nome{font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}.marca .nome b{color:var(--acc)}
.live{display:flex;align-items:center;gap:8px;font-size:var(--fs-cap);color:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);flex:none}
.dot.off{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.esp{flex:1}
.turnos{display:flex;padding:3px;border-radius:var(--r-pill);background:var(--surface-2);font-size:var(--fs-sm);font-weight:600}
.turnos a{padding:6px 14px;border-radius:var(--r-pill);color:var(--ink-3);border:1px solid transparent}
.turnos a[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);border-color:var(--line)}
.t-c,.uf-c{display:none}
.ufpill{position:relative;display:flex;align-items:center;gap:10px;padding:7px 12px 7px 14px;border:1px solid var(--line);border-radius:var(--r-pill);font-size:var(--fs-sm);cursor:pointer;background:var(--surface)}
.ufpill .ufl,.ufpill .car{color:var(--ink-3)}
.ufpill select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.tema{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.tema i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
nav.menu{max-width:var(--max);margin:8px auto 0;padding:0 24px;display:flex;gap:4px}
nav.menu a{padding:10px 14px;font-size:var(--fs-body);font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
nav.menu a:hover{color:var(--ink)}
nav.menu a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--acc)}

/* ---- layout ---- */
main{max-width:var(--max);margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));align-items:start}
.cols3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.pagina-titulo h1{margin:0;font-size:var(--fs-h1);line-height:var(--lh-tight);font-weight:800;letter-spacing:-.015em}
.pagina-titulo p{margin:6px 0 0;color:var(--ink-2)}
.secao{margin:6px 0 -6px;font-size:var(--fs-cap);font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}

/* ---- cartões ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px;box-shadow:var(--shadow)}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h2{font-size:var(--fs-h3);margin:0;font-weight:700}
.sub{color:var(--ink-2);font-size:var(--fs-sm);margin:2px 0 0}
.apur-t{color:var(--ink-2);font-size:var(--fs-sm);white-space:nowrap}
.apur{height:6px;background:var(--track);border-radius:3px;margin:10px 0 14px;overflow:hidden}
.apur i{display:block;height:100%;background:var(--acc);transition:width .6s}
.nota{color:var(--ink-3);font-size:var(--fs-cap);margin:10px 0 0}
.vazio{color:var(--ink-3);padding:18px 0;text-align:center}
.link{color:var(--acc);font-weight:700;font-size:var(--fs-sm)}
.rodape-card{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* ---- status e selos (1º turno) ---- */
.status{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:var(--r-box);margin:0 0 12px}
.status b{font-size:var(--fs-cap);letter-spacing:.05em;font-weight:800}.status span{font-size:var(--fs-sm)}
.s-eleito,.s-1turno{background:var(--ok-soft)}.s-eleito b,.s-1turno b{color:var(--ok)}
.s-2turno{background:var(--warn-soft)}.s-2turno b{color:var(--warn)}
.s-aberto{background:var(--info-soft)}.s-aberto b{color:var(--info)}
.badge{display:inline-block;padding:2px 9px;border-radius:var(--r-pill);font-size:var(--fs-cap);font-weight:700;white-space:nowrap}
.b-eleito,.b-1turno{background:var(--ok-soft);color:var(--ok)}
.b-2turno{background:var(--warn-soft);color:var(--warn)}
.b-aberto{background:var(--info-soft);color:var(--info)}

/* ---- candidatos (1º turno) ---- */
.cand{display:grid;grid-template-columns:40px 1fr auto;gap:3px 12px;align-items:center;padding:8px 8px;margin:0 -8px;border-radius:var(--r-box)}
.cand.flash,.item.flash,.linha.flash,.lado2.flash{animation:fl 2.4s ease-out}
@keyframes fl{0%{background:var(--flash)}100%{background:transparent}}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:var(--fs-cap)}
.cn{min-width:0;display:flex;flex-direction:column;gap:2px}
.cn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand.top .cn b{font-size:var(--fs-lg)}
.cv{text-align:right;display:flex;flex-direction:column}
.cv b{font-size:var(--fs-lg)}.cv small{color:var(--ink-3);font-size:var(--fs-cap)}
.bar{grid-column:2/-1;position:relative;height:7px;background:var(--track);border-radius:4px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;transition:width .6s}
.bar u{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink-3);opacity:.6}
.chip{display:inline-block;padding:2px 8px;border-radius:var(--r-chip);font-size:var(--fs-cap);font-weight:800;color:#fff;white-space:nowrap;width:fit-content;letter-spacing:.02em}

/* ---- duelo do resumo do 1º turno ---- */
.duelo{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:6px 0}
.lado{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.lado .av{width:64px;height:64px;font-size:22px}
.lado .n{font-weight:700;font-size:var(--fs-lg);line-height:1.2}
.lado .p{font-size:30px;font-weight:800;letter-spacing:-.02em}
.lado small{color:var(--ink-3)}
.vs{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-3);font-weight:700}
.duelo-mini{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:var(--fs-sm)}
.duelo-mini .l{display:flex;flex-direction:column;gap:2px}.duelo-mini .l:last-child{text-align:right;align-items:flex-end}
.duelo-mini .uf{font-weight:800;color:var(--ink-3)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;display:block}
.tile .n{font-size:30px;font-weight:800;letter-spacing:-.02em}
.tile .l{color:var(--ink-3);font-size:var(--fs-cap)}
a.tile:hover,a.card:hover{border-color:var(--acc)}

/* ---- listas ---- */
.item{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:6px 8px;margin:0 -8px;border-radius:8px}
.item .pos{color:var(--ink-3);font-size:var(--fs-cap);text-align:right}
.item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:8px;align-items:center}
.item .v{color:var(--ink-3);font-size:var(--fs-cap)}
.item.fora{opacity:.6}
.sep{border-top:1px dashed var(--line);margin:8px 0 4px;color:var(--ink-3);font-size:var(--fs-cap);padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.linha{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.linha:last-child{border-bottom:0}.linha:hover{background:var(--surface-2)}
.linha .uf{font-weight:800;color:var(--ink-3)}
.linha .m{min-width:0}.linha .m div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha .m small{color:var(--ink-3);font-size:var(--fs-cap)}
.linha .r{text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.duas{columns:2 260px;column-gap:28px}.duas .item{break-inside:avoid}

/* ---- mapas SVG, tooltip e controles ---- */
.mapa svg{width:100%;height:auto;display:block;max-height:540px}
.mapa path{stroke:var(--surface);stroke-width:.6;stroke-linejoin:round}
.mapa path.clic{cursor:pointer}.mapa path:hover{stroke:var(--ink);stroke-width:1.4}
.seg{display:inline-flex;gap:4px;margin:0 0 12px;background:var(--surface-2);padding:3px;border-radius:var(--r-pill)}
.seg button,.seg2 button{border:0;background:transparent;color:var(--ink-3);padding:6px 14px;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:700;cursor:pointer}
.seg button.on,.seg2 button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seg2{display:inline-flex;padding:3px;border-radius:var(--r-pill);background:var(--surface-2)}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;font-size:var(--fs-cap);box-shadow:0 8px 28px rgba(0,0,0,.22);display:none;max-width:270px}
#tip b{display:block;margin-bottom:3px}#tip div{display:flex;justify-content:space-between;gap:14px}

.aviso{background:var(--warn-soft);border:1px solid var(--line);color:var(--warn);padding:9px 14px;border-radius:var(--r-box);font-weight:700;font-size:var(--fs-sm)}
.dbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--track);margin:14px 0 4px;position:relative}
.dbar i{display:block;height:100%;transition:width .6s}
.dbar u{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}

/* ---- 2º turno: bloco de título, duelo, "em disputa" ---- */
.tit{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.tit>div:first-child{min-width:0}
.tit h1{margin:0;font-size:var(--fs-h1);line-height:var(--lh-tight);font-weight:800;letter-spacing:-.015em;text-wrap:pretty}
.tit .sub2{color:var(--ink-2);font-size:var(--fs-body);margin-top:6px;text-wrap:pretty}
.kick{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.kick .kl{display:block;font-size:var(--fs-cap);color:var(--ink-3);font-weight:600;line-height:1.1}
.kick strong{display:block;font-size:22px;line-height:1.1}
.kick .vl{width:1px;align-self:stretch;background:var(--line)}
.kick .kn{font-size:var(--fs-sm);color:var(--ink-2);max-width:180px}
.sim{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r-box);background:var(--warn-soft);color:var(--warn);font-size:var(--fs-sm);border:1px solid var(--line)}
.sim span{color:var(--ink-2)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px;align-items:start}
.dcard{container-type:inline-size;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.dtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.dtop>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.dtop .cg{font-size:var(--fs-cap);font-weight:700;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.dtop h2{margin:0;font-size:var(--fs-h3);font-weight:700}
.dtop .meta{font-size:var(--fs-sm);color:var(--ink-2);white-space:nowrap}
.apur6{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.apur6 i{display:block;height:100%;background:var(--acc);transition:width .6s}
.st{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:var(--r-box)}
.st b{font-size:var(--fs-cap);font-weight:800;letter-spacing:.05em}
.st span{font-size:var(--fs-sm);color:var(--ink);text-wrap:pretty}
.st.info{background:var(--info-soft)}.st.info b{color:var(--info)}
.st.warn{background:var(--warn-soft)}.st.warn b{color:var(--warn)}
.st.ok{background:var(--ok-soft)}.st.ok b{color:var(--ok)}
.lados{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lado2{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0;border-radius:var(--r-box)}
.av2{width:56px;height:56px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px}
.lado2 .nm{font-size:clamp(16px,4.2cqi,20px);font-weight:700;line-height:1.2;text-wrap:balance}
.lado2 .pc{font-size:var(--fs-num);font-weight:800;line-height:1;letter-spacing:-.02em;margin-top:4px}
.lado2 .au{font-size:var(--fs-cap);color:var(--ink-3);text-wrap:balance}
.lados .x{position:absolute;left:50%;top:18px;transform:translateX(-50%);font-size:var(--fs-sm);font-weight:700;color:var(--ink-3)}
.b50{position:relative;padding-top:22px}
.b50 .rot{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:var(--fs-cap);font-weight:700;background:var(--surface);padding:0 6px;white-space:nowrap}
.b50 .tr{display:flex;gap:2px;height:16px;border-radius:8px;overflow:hidden;background:var(--track)}
.b50 .tr i{display:block;height:100%;transition:width .6s}
.b50 .mk{position:absolute;left:50%;top:18px;height:24px;width:2px;margin-left:-1px;background:var(--ink)}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const milhar = n => Math.round(n).toLocaleString("pt-BR");
const pct = n => n.toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2}) + "%";
const pct1 = n => n.toLocaleString("pt-BR", {minimumFractionDigits:1, maximumFractionDigits:1}) + "%";
const SEGUNDO_TURNO = "25/10";

/* ---- nomes ---- */
const MINUS = new Set(["de","da","do","dos","das","e","di","du"]);
const SIGLAS = new Set(["TSE","UF","STF","TRE","DF","PT","PL","PP"]);
const nome = s => String(s || "").toLowerCase().split(/\s+/).map((w, i) => {
  if (i > 0 && MINUS.has(w)) return w;
  if (/^[^aeiouáéíóúâêôãõ.]{2,4}$/.test(w)) return w.toUpperCase();          // siglas: MLB, JHC, PT
  return w.charAt(0).toUpperCase() + w.slice(1);
}).join(" ").replace(/\bFlavio\b/g, "Flávio");
const bonito = t => String(t || "").replace(/[A-ZÁÉÍÓÚÂÊÔÃÕÇ][A-ZÁÉÍÓÚÂÊÔÃÕÇ.]+(?: [A-ZÁÉÍÓÚÂÊÔÃÕÇ.]+)*/g, m => SIGLAS.has(m) ? m : nome(m));
const iniciais = n => String(n).split(/\s+/).filter(w => !MINUS.has(w.toLowerCase()) && !/^(dr|dra)\.?$/i.test(w)).slice(0, 2).map(w => w[0]).join("").toUpperCase();

/* ---- cores dos partidos (identidade visual; ordem = espectro esquerda → direita) ---- */
const PARTIDOS = {
  PSTU:"#7f1d1d", PCO:"#991b1b", PCB:"#b91c1c", UP:"#be123c",
  PSOL:"#c2185b", PT:"#dc2626", PCDOB:"#9f1239", "PC DO B":"#9f1239", PV:"#84cc16", REDE:"#10b981",
  PSB:"#f97316", PDT:"#0ea5e9", CIDADANIA:"#ec4899", PSDB:"#0369a1",
  MDB:"#eab308", PSD:"#0d9488", PODE:"#06b6d4", AVANTE:"#7c3aed", SOLIDARIEDADE:"#f59e0b", PRD:"#6b7280",
  MOBILIZA:"#a16207", DC:"#64748b", PMB:"#92400e", AGIR:"#4d7c0f",
  "UNIÃO":"#3b82f6", PP:"#1e3a8a", REPUBLICANOS:"#6366f1", "MISSÃO":"#374151", PRTB:"#15803d",
  PL:"#16a34a", NOVO:"#c2410c"
};
const ESPECTRO = Object.keys(PARTIDOS);
const norm = sg => String(sg).split("/")[0].trim().toUpperCase();
const cor = sg => {
  const k = norm(sg);
  if (PARTIDOS[k]) return PARTIDOS[k];
  let h = 0; for (const c of k) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 35% 38%)`;
};
const ordemEspectro = (a, b) => { const x = ESPECTRO.indexOf(norm(a)), y = ESPECTRO.indexOf(norm(b)); return (x < 0 ? 99 : x) - (y < 0 ? 99 : y); };
const TOK = new Set(["pt","pl","uniao","pp","republicanos","psd","mdb","pode","psb","psol","psdb","pdt","novo","avante","pv","rede","pcdob","cidadania","solidariedade","prd","missao","up","pstu"]);
const slug = sg => String(sg).split("/")[0].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
const corChip = sg => TOK.has(slug(sg)) ? `var(--p-${slug(sg)}-chip)` : cor(sg);      // selos e avatares: contraste AA com texto branco
const corPura = sg => TOK.has(slug(sg)) ? `var(--p-${slug(sg)})` : cor(sg);          // barras e mapas (CSS)
const chip = sg => `<span class="chip" style="background:${corChip(sg)}">${esc(sg)}</span>`;
const chipN = (sg, n) => `<span class="chip" style="background:${corChip(sg)}">${esc(sg)} · ${n}</span>`;

const ESTADOS = {AC:"Acre",AL:"Alagoas",AM:"Amazonas",AP:"Amapá",BA:"Bahia",CE:"Ceará",DF:"Distrito Federal",ES:"Espírito Santo",
  GO:"Goiás",MA:"Maranhão",MG:"Minas Gerais",MS:"Mato Grosso do Sul",MT:"Mato Grosso",PA:"Pará",PB:"Paraíba",PE:"Pernambuco",
  PI:"Piauí",PR:"Paraná",RJ:"Rio de Janeiro",RN:"Rio Grande do Norte",RO:"Rondônia",RR:"Roraima",RS:"Rio Grande do Sul",
  SC:"Santa Catarina",SE:"Sergipe",SP:"São Paulo",TO:"Tocantins"};
const UF_COD = {"12":"AC","27":"AL","13":"AM","16":"AP","29":"BA","23":"CE","53":"DF","32":"ES","52":"GO","21":"MA","31":"MG",
  "50":"MS","51":"MT","15":"PA","25":"PB","26":"PE","22":"PI","41":"PR","33":"RJ","24":"RN","11":"RO","14":"RR","43":"RS",
  "42":"SC","28":"SE","35":"SP","17":"TO"};

/* ---- estado da aplicação ---- */
const PAG_T1 = [["resumo","Resumo"], ["presidente","Presidente"], ["governador","Governador"], ["senado","Senado"], ["deputados","Deputados"]];
const PAG_T2 = [["resumo","Resumo"], ["presidente","Presidente"], ["governador","Governador"]];
let turno = 2, pag = "resumo", uf = null, ultimo = null, anterior = {}, atual = {}, depTipo = "fed";
const paginasAtuais = () => turno === 1 ? PAG_T1 : PAG_T2;
try { uf = localStorage.getItem("uf"); } catch (e) {}

function marca(chave, valor) {            // " flash" quando o valor mudou desde a última leitura
  atual[chave] = valor;
  return chave in anterior && anterior[chave] !== valor ? " flash" : "";
}

/* ---- roteamento por hash: #/pagina/UF ---- */
function lerHash() {                                    // #/pagina/UF[/1]  (sem o "/1" = 2º turno)
  const [p, u, t] = location.hash.replace(/^#\/?/, "").split("/");
  return {p: PAG_T1.some(x => x[0] === p) ? p : "resumo", u: (u || "").toUpperCase(), t: t === "1" ? 1 : 2};
}
const hashDe = (p, u, t) => `#/${p}/${u || uf || ""}${(t || turno) === 1 ? "/1" : ""}`;
function irPara(p, u, t) { location.hash = hashDe(p, u, t); }
function sincronizar() {
  const r = lerHash(), mudou = r.t !== turno;
  turno = r.t; pag = r.p;
  if (!paginasAtuais().some(x => x[0] === pag)) pag = "resumo";
  if (mudou) ultimo = null;
  const novaUf = r.u && ESTADOS[r.u] && r.u !== uf;
  if (novaUf) { uf = r.u; try { localStorage.setItem("uf", uf); } catch (e) {} }
  if (mudou || novaUf) carregar();
  atualizarUfPill();
}
window.addEventListener("hashchange", () => { sincronizar(); anterior = {}; desenhar(); window.scrollTo(0, 0); });

/* ---- hemiciclo ---- */
function hemiciclo(partidos, total, rotulo, fora = 0) {
  const lista = partidos.slice().sort((a, b) => ordemEspectro(a[0], b[0]));
  const cores = [];
  for (const [n, q] of lista) for (let i = 0; i < q; i++) cores.push([n, cor(n)]);
  const N = cores.length, R = Math.max(3, Math.round(Math.sqrt(N / 7)));
  const ext = fora ? 160 : 190, int = ext * 0.42, dr = (ext - int) / (R - 1);
  const raios = Array.from({length: R}, (_, i) => int + i * dr), soma = raios.reduce((a, b) => a + b, 0);
  const qtd = raios.map(r => Math.round(N * r / soma));
  qtd[R - 1] += N - qtd.reduce((a, b) => a + b, 0);
  const pts = [];
  raios.forEach((r, i) => { for (let k = 0; k < qtd[i]; k++) {
    const a = Math.PI - Math.PI * (qtd[i] === 1 ? 0.5 : k / (qtd[i] - 1));
    pts.push({x: 200 + r * Math.cos(a), y: 200 - r * Math.sin(a), a, r});
  }});
  pts.sort((p, q) => q.a - p.a || p.r - q.r);
  const rd = Math.min(...raios.map((r, i) => 0.46 * Math.min(dr, Math.PI * r / Math.max(qtd[i] - 1, 1))));
  let bolas = pts.map((p, i) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${rd.toFixed(1)}" fill="${cores[i][1]}"><title>${esc(cores[i][0])}</title></circle>`).join("");
  for (let k = 0; k < fora; k++) {
    const a = Math.PI - Math.PI * k / (fora - 1);
    bolas += `<circle cx="${(200 + 190 * Math.cos(a)).toFixed(1)}" cy="${(200 - 190 * Math.sin(a)).toFixed(1)}" r="${(rd * 0.9).toFixed(1)}" fill="var(--bar)"><title>mandato até 2031 (eleito em 2022)</title></circle>`;
  }
  return `<svg viewBox="0 0 400 215" style="width:100%;max-width:560px;display:block;margin:0 auto" role="img" aria-label="${esc(rotulo)}">${bolas}
    <text x="200" y="182" text-anchor="middle" font-size="34" font-weight="800" fill="currentColor">${total + fora}</text>
    <text x="200" y="202" text-anchor="middle" font-size="11" fill="var(--mut)">${esc(rotulo)}</text></svg>`;
}
const legenda = (partidos, extra) => `<div class="chips">${partidos.map(([n, q]) => chipN(n, q)).join("")}${extra || ""}</div>`;

function cardCamara(d, completo) {
  const c = d.camara;
  if (!c || !c.partidos.length) return cardVazio("Câmara dos Deputados");
  const tot = c.partidos.reduce((a, p) => a + p[1], 0);
  return `<section class="card"><div class="ch"><h2>Câmara dos Deputados</h2><span class="apur-t">${tot} de 513 cadeiras</span></div>
    <p class="sub" style="margin-bottom:8px">Projeção da bancada · esquerda → direita</p>${hemiciclo(c.partidos, tot, "deputados federais")}
    ${legenda(completo ? c.partidos : c.partidos.slice(0, 8))}
    <p class="nota">Maioria: 257. Maior bancada: ${esc(c.partidos[0][0])} (${c.partidos[0][1]}).${c.faltam.length ? " Sem dados: " + c.faltam.join(", ") + "." : ""}</p></section>`;
}
function cardSenadoBR(d, completo) {
  const s = d.senado;
  if (!s || !s.partidos.length) return cardVazio("Senado Federal");
  const tot = s.partidos.reduce((a, p) => a + p[1], 0), resto = 81 - tot;
  const cinza = resto > 0 ? `<span class="chip" style="background:var(--bar);color:var(--mut)">mandato até 2031 · ${resto}</span>` : "";
  return `<section class="card"><div class="ch"><h2>Senado Federal</h2><span class="apur-t">${tot} vagas em disputa</span></div>
    <p class="sub" style="margin-bottom:8px">2 por estado · esquerda → direita</p>${hemiciclo(s.partidos, tot, "senadores", resto)}
    ${legenda(completo ? s.partidos : s.partidos.slice(0, 8), cinza)}
    <p class="nota">As ${resto} cadeiras em cinza foram eleitas em 2022 e não estão em disputa; o partido delas ainda não é carregado. ${s.tse} de ${tot} vagas já confirmadas pelo TSE.</p></section>`;
}

/* ---- mapas (SVG próprio, sem biblioteca) ---- */
let tips = {};
const geoCache = {}, mapaCache = {}, mapaVai = {};
function projecao(fc) {
  if (fc._p) return fc._p;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  const varre = c => typeof c[0] === "number" ? (x0 = Math.min(x0, c[0]), x1 = Math.max(x1, c[0]), y0 = Math.min(y0, c[1]), y1 = Math.max(y1, c[1])) : c.forEach(varre);
  fc.features.forEach(f => varre(f.geometry.coordinates));
  const k = Math.cos((y0 + y1) / 2 * Math.PI / 180), e = 600 / ((x1 - x0) * k);
  return fc._p = {H: (y1 - y0) * e, pt: (lo, la) => [((lo - x0) * k * e).toFixed(1), ((y1 - la) * e).toFixed(1)]};
}
function caminho(f, pr) {
  if (f._d) return f._d;
  const g = f.geometry, polis = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
  return f._d = polis.map(po => po.map(an => "M" + an.map(p => pr.pt(p[0], p[1]).join(",")).join("L") + "Z").join("")).join("");
}
function topHtml(titulo, r) {
  const linhas = r.cands.map(c => `<div><span>${esc(nome(c.nome))} <small>${esc(c.sg)}</small></span><b style="display:inline">${pct(c.pct)}</b></div>`).join("");
  return `<b>${esc(titulo)}</b>${linhas}<small style="color:var(--ink-3)">${pct(r.apur)} apurado</small>`;
}
function degrau(sg, pp) {                   // 3 degraus de vantagem: até 5 p.p., de 5 a 15, mais de 15
  if (pp > 15) return {bg: corChip(sg), fg: "#fff", n: 3};
  return {bg: `color-mix(in oklch, ${corPura(sg)} ${pp > 5 ? 62 : 30}%, var(--surface))`, fg: "var(--ink)", n: pp > 5 ? 2 : 1};
}
function svgMapa(id, fc, chave, dados, titulo, clicavel, modo) {
  const pr = projecao(fc), cont = {};
  tips[id] = {};
  const paths = fc.features.map(f => {
    const k = chave(f), r = dados[k];
    let attr = 'fill="var(--track)"';
    if (r && r.cands.length) {
      const l = r.cands[0];
      if (modo === "duelo" && r.cands[1]) attr = `style="fill:${degrau(l.sg, l.pct - r.cands[1].pct).bg}"`;
      else attr = `fill="${cor(l.sg)}" fill-opacity="${(0.42 + 0.58 * Math.max(0, Math.min(1, (l.pct - 25) / 40))).toFixed(2)}"`;
      cont[l.sg] = (cont[l.sg] || 0) + 1;
      tips[id][k] = topHtml(titulo(f, k), r);
    } else tips[id][k] = `<b>${esc(titulo(f, k))}</b><small style="color:var(--ink-3)">sem dados</small>`;
    return `<path data-m="${id}" data-k="${k}" class="${clicavel ? "clic" : ""}" d="${caminho(f, pr)}" ${attr}></path>`;
  }).join("");
  const leg = Object.entries(cont).sort((a, b) => b[1] - a[1]).map(([sg, n]) => chipN(sg, n)).join("");
  return `<svg viewBox="0 0 600 ${pr.H.toFixed(0)}" role="img">${paths}</svg><div class="chips">${leg}</div>
    <p class="nota">${modo === "duelo" ? "Cor = quem tem mais votos entre os dois finalistas, em 3 degraus de vantagem (até 5 p.p., 5 a 15, mais de 15)."
      : "Cor = partido do mais votado · cor mais forte = maior fatia dos votos válidos."} Passe o mouse ou toque para ver os detalhes.</p>`;
}
const CARGOS = {"1": "Presidente", "3": "Governador", "5": "Senador"};
function mapaBR(d, cargo, modo, sub) {
  const g = geoCache["/geo/br"];
  let corpo = '<div class="skel"></div>';
  if (g && g.v && d.mapa_br) {
    const dados = {};
    for (const [u, v] of Object.entries(d.mapa_br)) if (v[cargo]) dados[u] = v[cargo];
    corpo = svgMapa("br", g.v, f => UF_COD[f.properties.codarea], dados, (f, k) => `${ESTADOS[k] || k} — ${CARGOS[cargo]}`, true, modo);
  }
  return `<section class="card mapa"><div class="ch"><h2>Brasil por estado</h2></div><p class="sub" style="margin-bottom:10px">${sub || "Quem lidera em cada estado."} Clique para escolher o estado.</p>${corpo}</section>`;
}
function mapaUF(cargo, modo) {
  const u = uf || "RN", g = geoCache["/geo/uf/" + u], m = mapaCache[`${u}:${cargo}:${turno}`];
  let corpo = '<div class="skel"></div>';
  if (g && g.v && m && m.v) {
    const nm = m.v.municipios, n = Object.keys(nm).length;
    corpo = svgMapa("uf", g.v, f => f.properties.codarea, nm, (f, k) => `${nm[k] ? nm[k].nome : k} — ${CARGOS[cargo]}`, false, modo) +
      `<p class="nota">${n} de ${m.v.total} municípios com dados.</p>`;
  }
  const sub = modo !== "duelo" ? "Quem lidera em cada município."
    : (m && m.v && m.v.modo === "2t" ? "Resultado do 2º turno em cada município." : "Os dois finalistas no 1º turno, município a município.");
  return `<section class="card mapa"><div class="ch"><h2>${esc(ESTADOS[u] || u)} por município</h2></div><p class="sub" style="margin-bottom:10px">${sub}</p>${corpo}</section>`;
}
function garantirMapas(cargo) {
  const u = uf || (ultimo && ultimo.uf && ultimo.uf.sigla);
  const carrega = (chave, url, destino) => {
    const x = destino[chave];
    if (x && (x.fixo || Date.now() - x.t < 45000)) return;
    if (mapaVai[chave]) return;
    mapaVai[chave] = 1;
    fetch(url).then(r => { if (!r.ok) throw 0; return r.json(); })
      .then(v => { destino[chave] = {v, t: Date.now(), fixo: url.startsWith("/geo/")}; })
      .catch(() => { destino[chave] = {v: x ? x.v : null, t: Date.now()}; })     // falha: não insiste por 45 s
      .finally(() => { delete mapaVai[chave]; desenhar(); });
  };
  carrega("/geo/br", "/geo/br", geoCache);
  if (u) { carrega("/geo/uf/" + u, "/geo/uf/" + u, geoCache); carrega(`${u}:${cargo}:${turno}`, `/api/mapa?uf=${u}&cargo=${cargo}&turno=${turno}`, mapaCache); }
}

/* ---- páginas ---- */
const paginaTitulo = (t, sub) => `<div class="pagina-titulo"><h1>${esc(t)}</h1><p>${sub}</p></div>`;

function duelo(a, b, rotulo) {
  const lado = c => `<div class="lado"><span class="av" style="background:${corChip(c.sg)}">${esc(iniciais(c.nome))}</span>
    <div class="n">${esc(nome(c.nome))}</div>${chip(c.sg)}<div class="p">${pct1(c.pct)}</div><small>${milhar(c.votos)} votos</small></div>`;
  return `<div class="duelo">${lado(a)}<div class="vs"><span class="badge b-2turno">${esc(rotulo)}</span><span>x</span></div>${lado(b)}</div>`;
}
function dueloMini(g) {
  const m = ultimo.mapa_br[g.uf], c = (m && m["3"] ? m["3"].cands : []);
  if (c.length < 2) return "";
  return `<a class="card" href="#/governador/${g.uf}" style="padding:12px 14px"><div class="duelo-mini">
    <div class="l"><span>${esc(nome(c[0].nome))}</span><small>${chip(c[0].sg)} <b>${pct1(c[0].pct)}</b></small></div>
    <span class="uf">${g.uf}</span>
    <div class="l"><span>${esc(nome(c[1].nome))}</span><small><b>${pct1(c[1].pct)}</b> ${chip(c[1].sg)}</small></div></div></a>`;
}

function pgResumo(d) {
  const p = d.pres, gb = d.gov_br || [], u = d.uf || {};
  const duelos = gb.filter(g => g.tipo === "2turno"), eleitos = gb.filter(g => g.tipo !== "2turno");
  let heroi = cardVazio("Presidente");
  if (p && p.cands.length > 1) {
    const s = p.situacao || {};
    heroi = `<section class="card"><div class="ch"><h2>Presidente da República</h2><span class="apur-t">${pct(p.apur)} apurado</span></div>${apurBar(p.apur)}
      ${s.tipo === "2turno" ? duelo(p.cands[0], p.cands[1], "2º TURNO · " + SEGUNDO_TURNO) : statusHtml(s) + candRow(p.cands[0], {top: true, k: "res"})}
      <div class="rodape-card"><span class="sub">${esc(bonito(s.rotulo || ""))}</span><a class="link" href="#/presidente/${uf || ""}">Ver detalhes →</a></div></section>`;
  }
  const seuEstado = u.gov ? `<section class="card"><div class="ch"><h2>${esc(ESTADOS[u.sigla] || u.sigla)}</h2><span class="apur-t">seu estado</span></div>
      <div style="margin-top:10px"><p class="secao" style="margin:0 0 6px">Governador</p>${statusHtml(u.gov.situacao)}
        ${u.gov.cands.slice(0, 3).map((c, i) => candRow(c, {top: i === 0, k: "rg"})).join("")}</div>
      ${u.sen ? `<p class="secao" style="margin:14px 0 4px">Senado</p><p style="margin:0">${u.sen.cands.slice(0, u.sen.nv).map(c => esc(nome(c.nome)) + " " + chip(c.sg)).join(" &nbsp;·&nbsp; ")}</p>
        <p class="nota" style="margin-top:4px">${esc(bonito(u.sen.situacao.rotulo))}</p>` : ""}
      <div class="rodape-card"><a class="link" href="#/governador/${u.sigla}">Governador →</a><a class="link" href="#/senado/${u.sigla}">Senado →</a><a class="link" href="#/deputados/${u.sigla}">Deputados →</a></div></section>` : "";
  const tiles = `<div class="cols3">
    <a class="tile" href="#/governador/${uf || ""}"><div class="n">${eleitos.length}</div><div class="l">governadores eleitos no 1º turno</div></a>
    <a class="tile" href="#/governador/${uf || ""}"><div class="n" style="color:var(--warn)">${duelos.length}</div><div class="l">estados com 2º turno para governador</div></a>
    <a class="tile" href="#/senado/${uf || ""}"><div class="n">${d.senado ? d.senado.partidos.reduce((a, x) => a + x[1], 0) : "–"}</div><div class="l">vagas no Senado definidas nesta eleição</div></a>
    <a class="tile" href="#/deputados/${uf || ""}"><div class="n">${d.camara ? d.camara.vagas : "–"}</div><div class="l">cadeiras da Câmara projetadas</div></a></div>`;
  const dg = duelos.length ? `<h2 class="secao">Governos em 2º turno · ${SEGUNDO_TURNO}</h2><div class="cols3" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))">${duelos.map(dueloMini).join("")}</div>` : "";
  return paginaTitulo("Como está a eleição", `Resultados da divulgação oficial do TSE${p ? " · " + pct(p.apur) + " das seções apuradas" : ""}`) +
    `<div class="grid">${heroi}${seuEstado}</div>${tiles}${dg}
    <div class="grid">${cardCamara(d, false)}${cardSenadoBR(d, false)}</div>`;
}

function pgPresidente(d) {
  garantirMapas("1");
  return paginaTitulo("Presidente da República", "Total nacional e, ao lado, estado por estado.") +
    `<div class="grid">${cardMaj("Brasil", d.pres, {l50: true})}${mapaBR(d, "1")}</div>${mapaUF("1")}`;
}

function pgGovernador(d) {
  garantirMapas("3");
  const u = d.uf || {}, gb = d.gov_br || [];
  const ordem = [...gb].sort((a, b) => (a.tipo === "2turno" ? 0 : 1) - (b.tipo === "2turno" ? 0 : 1) || a.uf.localeCompare(b.uf));
  const lista = ordem.map(g => {
    const m = d.mapa_br[g.uf], c = (m && m["3"] ? m["3"].cands : []);
    const rival = c[1] ? `${nome(c[1].nome)} ${pct1(c[1].pct)}` : "";
    return `<div class="linha${marca("g" + g.uf, g.votos)}" data-uf="${g.uf}" tabindex="0"><span class="uf">${g.uf}</span>
      <div class="m"><div><b>${esc(nome(g.nome))}</b> ${chip(g.sg)}</div><small>${rival ? "x " + esc(rival) + " · " : ""}${pct(g.apur)} apurado</small></div>
      <div class="r"><b>${pct1(g.pct)}</b><span class="badge b-${g.tipo}">${esc(g.rotulo)}</span></div></div>`;
  }).join("");
  return paginaTitulo("Governador", "Seu estado em destaque e o panorama dos 27 estados.") +

/* ---- chat flutuante: RAG sobre os planos + ferramentas + o que está na tela ---- */
const chat = {id: null, msgs: [], ocupado: false, status: null, carregando: false, sugKey: null};
const NOME_PAG = {resumo: "Resumo", presidente: "Presidente", governador: "Governador", senado: "Senado", deputados: "Deputados"};
const FONTE_OK = u => /^https:\/\/divulgacandcontas\.tse\.jus\.br\//.test(u || "");
const CAND_INFO = {"lula": ["Lula", "PT"], "flavio bolsonaro": ["Flávio Bolsonaro", "PL"], "cadu de lula": ["Cadu de Lula", "PT"],
                   "cadu": ["Cadu de Lula", "PT"], "allyson": ["Allyson", "UNIÃO"]};
const semAcento = t => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();

function contextoDaPagina() {               // o que o usuário está vendo, para o assistente entender "aqui", "esse candidato"...
  const main = $("#app");
  const texto = main ? main.innerText.replace(/[ \t]+/g, " ").replace(/\n{2,}/g, "\n").trim().slice(0, 4500) : "";
  return {pagina: pag, turno, uf, texto};
}
function rotuloContexto() {

function sugestoesDaPagina() {

function mdRico(txt) {                      // markdown mínimo + um bloco por candidato, SEMPRE em ordem alfabética
  const linhas = esc(txt).split("\n");
  const antes = [], depois = [], blocos = [];
  let alvo = antes, lista = null, par = [], blk = null, blkLista = false;
  const inline = t => t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[(\d{1,4}(?:\s*[;,]\s*\d{1,4})*)\]/g, (m, g) =>
      g.split(/\s*[;,]\s*/).map(n => `<button class="ref" data-ref="${n}" aria-label="Fonte ${n}">${n}</button>`).join(""));      // [3] ou [3; 5]
  const fechaPar = () => { if (par.length) alvo.push("<p>" + inline(par.join(" ")) + "</p>"); par = []; };
  const fechaLista = () => { if (lista) { alvo.push(`</${lista}>`); lista = null; } };
  const fechaBloco = () => { fechaPar(); fechaLista(); if (blk) { blk.html.push("</div>"); blk = null; blkLista = false; alvo = depois; } };
  for (const l of linhas) {
    const h = l.match(/^\s*\*\*(.+?)\*\*\s*:?\s*$/);
    const info = h && CAND_INFO[semAcento(h[1].replace(/\s*\([^)]*\)\s*$/, ""))];
    if (info) {
      fechaBloco();
      blk = {k: info[0], html: [`<div class="cblk"><div class="ch2"><span class="av3" style="background:${corChip(info[1])}" aria-hidden="true">${esc(iniciais(info[0]))}</span><strong>${esc(info[0])}</strong>${chip(info[1])}</div>`]};
      blocos.push(blk); alvo = blk.html; continue;
    }
    const ul = l.match(/^\s*[-*•]\s+(.*)/), ol = l.match(/^\s*\d{1,2}[.)]\s+(.*)/), m = ul || ol;
    if (m) {
      const tipo = ul ? "ul" : "ol";
      fechaPar();
      if (lista !== tipo) { fechaLista(); alvo.push(`<${tipo}>`); lista = tipo; }
      alvo.push("<li>" + inline(m[1]) + "</li>"); blkLista = !!blk;
    } else if (!l.trim()) { fechaPar(); fechaLista(); }
    else {
      if (blk && blkLista && !lista) fechaBloco();      // texto depois da lista do bloco: fecha o bloco
      fechaLista(); par.push(l.trim());
    }
  }
  fechaBloco();
  blocos.sort((a, b) => a.k.localeCompare(b.k, "pt-BR"));    // neutralidade: a ordem não depende do que o modelo escreveu
  return antes.join("") + blocos.map(b => b.html.join("")).join("") + depois.join("");
}

function etapasHtml(m) {
  return `<div class="etapas" role="status" aria-live="polite">
    <span class="e ok"><span class="ic">✓</span>Pergunta entendida</span>

function msgHtml(m, i) {

  const fontes = m.fontes && m.fontes.length ? `<div class="fontes"><span class="cap">Fontes · ${m.fontes.length} ${m.fontes.length === 1 ? "trecho" : "trechos"}</span>${m.fontes.map(f => `

      <div class="corpo">${f.secao ? `<div class="sc">${esc(f.secao)}</div>` : ""}<blockquote>“${esc(f.texto)}”</blockquote>${FONTE_OK(f.fonte_url) ? `<a href="${esc(f.fonte_url)}" target="_blank" rel="noopener">Abrir o plano completo no TSE ↗</a>` : ""}</div></details>`).join("")}</div>` : "";
  return `<div class="msg a" data-i="${i}">${corpo}${etapas}${erro}${fontes}</div>`;
}
function avisoChat() {

function vazioHtml() {
  return `<div class="cw-vazio"><strong>Pergunte sobre o que está na tela</strong><span>Explico os números do TSE e mostro o que os planos de governo propõem, citando a página. Não indico voto.</span></div>
    <div class="sugs"><span class="cap">Sugestões para esta página</span>${sugestoesDaPagina().map(q => `<button data-sug="${esc(q)}"><span>${esc(q)}</span><b>→</b></button>`).join("")}</div>`;

function renderMsgs() {
  const box = $("#chat-msgs");
  if (!box) return;
  const perto = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const abertos = new Set([...box.querySelectorAll("details[open]")].map(d => d.id));
  box.innerHTML = avisoChat() + (chat.msgs.length ? chat.msgs.map(msgHtml).join("") : vazioHtml());
  chat.sugKey = pag + turno + uf;
  abertos.forEach(id => { const d = document.getElementById(id); if (d) d.open = true; });
  if (perto || chat.ocupado) box.scrollTop = box.scrollHeight;

function atualizarCtx() {                   // a cada redesenho: mantém o rótulo e as sugestões da página atual
  const el = $("#cw-ctx");
  if (!el) return;
  el.textContent = "Vendo: " + rotuloContexto();
  if (!chat.msgs.length && chat.sugKey !== pag + turno + uf) renderMsgs();
}
function atualizarEntrada() {
  const b = $("#chat-enviar"), t = $("#chat-texto");
  if (!b || !t) return;
  const ok = !!(chat.status && chat.status.ativo);
  b.disabled = chat.ocupado || !ok;
  t.disabled = !ok;
  t.placeholder = ok ? "Pergunte sobre o que está na tela…" : "Chat indisponível no momento";
}

function abrirChat(abrir) {
  const w = $("#cw");
  if (!w) return;
  w.dataset.aberto = abrir ? "1" : "0";
  $("#cw-fab").setAttribute("aria-expanded", abrir ? "true" : "false");
  try { sessionStorage.setItem("cw", abrir ? "1" : "0"); } catch (e) {}
  if (abrir) {
    atualizarCtx(); renderMsgs(); atualizarEntrada();
    if (!chat.status && !chat.carregando) {
      chat.carregando = true;
      fetch("/api/chat/status").then(r => r.json()).catch(() => ({ativo: false, motivo: "Servidor indisponível."}))
        .then(j => { chat.status = j; chat.carregando = false; renderMsgs(); atualizarEntrada(); });
    }
    setTimeout(() => { const t = $("#chat-texto"); if (t && !t.disabled && innerWidth > 619) t.focus(); }, 50);

function montarWidget() {
  const w = document.createElement("div");
  w.id = "cw"; w.dataset.aberto = "0";
  w.innerHTML = `
    <button id="cw-fab" aria-expanded="false" aria-controls="cw-painel"><span class="bal" aria-hidden="true"></span><span class="fl">Pergunte ao assistente</span><span class="fc">Pergunte</span></button>

function eventoChat(ev, m) {
  if (ev.tipo === "conversa") chat.id = ev.id;
  else if (ev.tipo === "ferramenta") m.ferr = ev.rotulo;
  else if (ev.tipo === "texto") { m.texto += ev.texto; m.ferr = null; }
  else if (ev.tipo === "fontes") m.fontes = ev.fontes;
  else if (ev.tipo === "erro") m.erro = ev.mensagem;
  renderMsgs();
}

async function enviarPergunta(texto, reenvio) {
  texto = String(texto || "").trim();
  if (!texto || chat.ocupado || !(chat.status && chat.status.ativo)) return;
  const m = {papel: "a", texto: "", fontes: [], ferr: null, erro: null};
  if (reenvio) chat.msgs.push(m); else chat.msgs.push({papel: "u", texto}, m);
  chat.ocupado = true; renderMsgs(); atualizarEntrada();
  try {
    const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
                                          body: JSON.stringify({conversa: chat.id, mensagem: texto, contexto: contextoDaPagina()})});
    if (!r.ok) throw new Error(r.status);
    const leitor = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const {done, value} = await leitor.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const bloco = buf.slice(0, i); buf = buf.slice(i + 2);
        if (bloco.startsWith("data: ")) { try { eventoChat(JSON.parse(bloco.slice(6)), m); } catch (e) {} }
      }
    }
  } catch (e) {
    m.erro = m.erro || "Não consegui falar com o servidor. Confira se ele está rodando.";
  }
  m.ferr = null; chat.ocupado = false; renderMsgs(); atualizarEntrada();
}

/* ---- 2º turno (redesenho) ---- */
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const diasPara = iso => { const [y, m, d] = iso.split("-").map(Number), h = new Date();
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(h.getFullYear(), h.getMonth(), h.getDate())) / 864e5); };
const dataBr = iso => iso.split("-").reverse().slice(0, 2).join("/");
const dataExtenso = iso => { const [, m, d] = iso.split("-").map(Number); return `${d} de ${MESES[m - 1]}`; };
const alfa = cs => [...cs].sort((x, y) => nome(x.nome).localeCompare(nome(y.nome), "pt-BR"));     // ordem fixa: não muda com o placar
const curto = c => nome(c.nome).split(" ")[0];
const pp2 = n => n.toLocaleString("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const avisoSim = d => d.meta && d.meta.simulado ? '<div class="sim"><strong>SIMULAÇÃO</strong><span>Dados fabricados para teste; não são resultados reais.</span></div>' : "";
const POS = {RR:[2,1],AP:[4,1],AM:[2,2],PA:[3,2],MA:[4,2],CE:[5,2],RN:[6,2],AC:[1,3],RO:[2,3],TO:[3,3],PI:[4,3],PE:[5,3],PB:[6,3],
  MT:[2,4],GO:[3,4],DF:[4,4],BA:[5,4],AL:[6,4],MS:[2,5],SP:[3,5],MG:[4,5],ES:[5,5],SE:[6,5],PR:[3,6],RJ:[4,6],SC:[3,7],RS:[3,8]};
const foco = {uf: null, mun: null};
let munModo = "grade";

function kicker(d) {
  const ao = d.pres && d.pres.ao_vivo, m = d.meta;
  let rotulo, valor, nota;
  if (ao) {
    const g = d.uf && d.uf.em_2turno && d.uf.gov && d.uf.gov.ao_vivo ? d.uf.gov : null;
    rotulo = "Seções apuradas"; valor = pct(d.pres.apur);
    nota = "Presidente." + (g ? ` No ${uf}, governador está em ${pct(g.apur)}.` : "");
  } else {
    const dias = diasPara(m.data_2t);
    rotulo = dataExtenso(m.data_2t);
    valor = dias > 1 ? `faltam ${dias} dias` : dias === 1 ? "amanhã" : dias === 0 ? "hoje" : "aguardando";
    nota = "Votação das 8h às 17h, horário de Brasília.";
  }
  return `<div class="kick"><div><span class="kl">${esc(rotulo)}</span><strong>${esc(valor)}</strong></div><div class="vl"></div><div class="kn">${esc(nota)}</div></div>`;
}
const blocoTitulo = (t, sub, d) => `<div class="tit"><div><h1>${esc(t)}</h1><div class="sub2">${esc(sub)}</div></div>${kicker(d)}</div>`;

function cardDuelo(cargo, escopo, d, link) {
  if (!d || d.cands.length < 2) return cardVazio(escopo);
  const ao = d.ao_vivo, [a, b] = alfa(d.cands), s = d.situacao || {};
  const tom = {aberto: "info", "2turno": "warn", eleito: "ok", "1turno": "ok"}[s.tipo] || "info";
  const lado = c => `<div class="lado2${marca("d" + escopo + c.nome, c.votos)}"><span class="av2" style="background:${corChip(c.sg)}" aria-hidden="true">${esc(iniciais(c.nome))}</span>
    <div class="nm">${c.eleito ? "★ " : ""}${esc(nome(c.nome))}</div>${chip(c.sg)}
    <div class="pc">${ao ? pct(c.pct) : pct1(c.pct)}</div>
    <div class="au">${ao ? `${milhar(c.votos)} votos · 1º turno ${pct1(c.pct1t)}` : `${milhar(c.votos)} votos no 1º turno`}</div></div>`;
  const resto = Math.max(0, 100 - a.pct - b.pct);
  const segs = ao ? [[a.pct, corPura(a.sg)], [b.pct, corPura(b.sg)]] : [[a.pct, corPura(a.sg)], [resto, "var(--n-elim)"], [b.pct, corPura(b.sg)]];
  const dpp = Math.abs(a.pct - b.pct), dv = Math.abs(a.votos - b.votos);
  return `<section class="dcard"><div class="dtop"><div><span class="cg">${esc(cargo)}</span><h2>${esc(escopo)}</h2></div>
      <span class="meta">${ao ? pct(d.apur) + " apurado" : "2º turno em " + dataBr(ultimo.meta.data_2t)}</span></div>
    ${ao ? `<div class="apur6" role="progressbar" aria-label="Seções apuradas" aria-valuenow="${d.apur}" aria-valuemin="0" aria-valuemax="100"><i style="width:${d.apur}%"></i></div>` : ""}
    <div class="st ${tom}"><b>${esc(s.rotulo || "")}</b><span>${esc(bonito(s.texto || ""))}</span></div>
    <div class="lados">${lado(a)}${lado(b)}<span class="x" aria-hidden="true">×</span></div>
    <div class="b50"><span class="rot">50% vence</span><div class="tr">${segs.map(([w, bg]) => `<i style="width:${w}%;background:${bg}"></i>`).join("")}</div><span class="mk"></span>
      <div class="lb"><span>${esc(curto(a))} ${ao ? pct(a.pct) : pct1(a.pct)}</span><span class="m">${ao ? "% dos votos válidos" : `cinza: ${pct1(resto)} foram para eliminados`}</span><span>${esc(curto(b))} ${ao ? pct(b.pct) : pct1(b.pct)}</span></div></div>
    <div class="dft"><span>${ao ? "Diferença agora" : "Diferença no 1º turno"}: ${pp2(dpp)} p.p. · ${milhar(dv)} votos</span>${link ? `<a href="#/${link}/${uf || ""}">Ver detalhes →</a>` : ""}</div></section>`;
}

function cardDisputa(escopo, d) {
  if (!d || !d.base || d.cands.length < 2) return cardVazio("O que está em disputa");
  const b = d.base, [a, c2] = alfa(d.cands), tot = b.aptos || 1;
  const aberto = b.outros_votos + b.brancos + b.nulos + b.abstencao;
  const linhas = [
    [nome(a.nome), a.votos1t, corPura(a.sg), "", 700], [nome(c2.nome), c2.votos1t, corPura(c2.sg), "", 700],
    ["Candidatos eliminados", b.outros_votos, "var(--n-elim)", "8px", 400], ["Votos brancos", b.brancos, "var(--n-branco)", "", 400],
    ["Votos nulos", b.nulos, "var(--n-nulo)", "", 400], ["Abstenção", b.abstencao, "var(--track)", "", 400]];
  const aresta = n => `box-shadow:inset 0 0 0 1px ${n === "Abstenção" ? "var(--line)" : "transparent"}`;
  const stk = linhas.map(([n, v, bg]) => `<i style="width:${v / tot * 100}%;background:${bg};${aresta(n)}" title="${esc(n)}"></i>`).join("");
  const leg = linhas.map(([n, v, bg, gap, fw]) => { const pt = gap ? `padding-top:${gap}` : "";
    return `<div class="l" style="${pt}"><span class="sw2" style="background:${bg};${aresta(n)}"></span><span style="font-weight:${fw}">${esc(n)}</span></div><span class="v" style="${pt}">${milhar(v)}</span><span class="pp" style="${pt}">${pct1(v / tot * 100)}</span>`; }).join("");
  const pills = b.eliminados.slice(0, 4).map(e => `<div class="pill">${chip(e.sg)}<span>${esc(nome(e.nome))}</span><strong>${pct1(e.pct)}</strong></div>`).join("");
  return `<section class="dsp"><div><h2>O que está em disputa · ${esc(escopo)}</h2><div class="sub">Como o eleitorado se dividiu no 1º turno · % de todos os eleitores aptos</div></div>
    <div class="stk">${stk}</div><div class="lg2">${leg}</div>
    <div class="aberto"><span>Em aberto para o 2º turno</span><strong>${pct1(aberto / tot * 100)} dos aptos</strong></div>
    <p><strong>${pct1(b.outros_pct)}</strong> dos votos válidos foram para candidatos que não chegaram ao 2º turno. Esses votos, os brancos, os nulos e a abstenção são o que ainda pode mudar o placar.</p>
    ${pills ? `<div style="display:flex;flex-direction:column;gap:8px"><span class="cap">Mais votados entre os eliminados</span><div class="pills">${pills}</div></div>` : ""}</section>`;
}

function cardUfSemT2(d) {
  const u = d.uf || {};
  return `<section class="card"><div class="ch"><h2>${esc(ESTADOS[u.sigla] || u.sigla)}</h2></div>
    <p class="vazio" style="text-align:left">O governo deste estado foi decidido no 1º turno, então não há 2º turno para governador aqui.</p>
    <div class="rodape-card"><a class="link" href="#/governador/${u.sigla}/1">Ver o resultado do 1º turno →</a></div></section>`;
}

function detHtml(titulo, r, selecionado) {         // painel de detalhe (funciona com mouse, teclado e toque)
  if (!r || !r.cands || r.cands.length < 2) return `<div class="hd"><strong>${esc(titulo)}</strong><span>sem dados</span></div>`;
  return `<div class="hd"><strong>${esc(titulo)}</strong><span>${selecionado ? "selecionado" : "visualizando"} · ${pct1(r.apur)} apurado</span></div>` +
    alfa(r.cands).map(c => `<div class="detl"><div class="r1"><span class="n">${esc(nome(c.nome))} ${chip(c.sg)}</span><strong>${pct1(c.pct)}</strong></div>
      <div class="trk"><i style="width:${c.pct}%;background:${corPura(c.sg)}"></i></div></div>`).join("");
}
function detUfHtml(d, x) {
  x = x || foco.uf || uf;
  const r = d.mapa_br && d.mapa_br[x] && d.mapa_br[x]["1"];
  return detHtml(ESTADOS[x] || x, r, x === uf) + (x === uf && pag === "presidente" ? `<button class="lnk" data-ir-mun>Ver o ${x} por município ↓</button>` : "");
}

function cardCartograma(d) {
  const dados = d.mapa_br || {}, cont = {}, ao = d.pres && d.pres.ao_vivo;
  const tiles = Object.entries(POS).map(([u, [col, row]]) => {
    const r = dados[u] && dados[u]["1"], c = r && r.cands, pos = `grid-column:${col};grid-row:${row}`;
    if (!c || c.length < 2) return `<div class="tile2" style="${pos};background:var(--track);color:var(--ink-3)"><strong>${u}</strong></div>`;
    const pp = c[0].pct - c[1].pct, g = degrau(c[0].sg, pp);
    cont[c[0].sg] = (cont[c[0].sg] || 0) + 1;
    return `<button class="tile2${u === uf ? " sel" : ""}" data-cg="${u}" style="${pos};background:${g.bg};color:${g.fg}" aria-label="${esc(ESTADOS[u])}: ${esc(nome(c[0].nome))} na frente por ${pp2(pp)} pontos percentuais"><strong>${u}</strong><span>+${Math.round(pp)}</span></button>`;
  }).join("");
  const top = Object.entries(cont).sort((a, b) => b[1] - a[1]), ex = top.slice(0, 2).map(x => x[0]);
  const quad = n => ex.map(sg => `<i style="background:${n === 3 ? corChip(sg) : `color-mix(in oklch, ${corPura(sg)} ${n === 2 ? 62 : 30}%, var(--surface))`}"></i>`).join("");
  return `<section class="mcard"><div class="mhead"><div><h2>Brasil por estado</h2><span class="sub">Quem teve mais votos entre os dois finalistas ${ao ? "no 2º turno" : "no 1º turno"}. Toque num estado para escolher.</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${top.map(([sg, n]) => chipN(sg, n)).join("")}</div></div>
    <div class="cg-wrap"><div class="cartog" id="cartog">${tiles}</div>
      <div class="det"><div class="detbox" id="det-uf">${detUfHtml(d)}</div>
        <div class="leg3"><span class="cap">Vantagem</span><div class="row"><span><span class="sq">${quad(1)}</span>até 5 p.p.</span><span><span class="sq">${quad(2)}</span>5 a 15 p.p.</span><span><span class="sq">${quad(3)}</span>mais de 15 p.p.</span></div>
          <span>Mapa em grade: cada estado tem o mesmo tamanho, para que estados grandes e pouco populosos não pareçam pesar mais.</span></div></div></div></section>`;
}

const cargoDaPagina = () => pag === "presidente" ? 1 : 3;
const munDados = () => { const m = mapaCache[`${uf || "RN"}:${cargoDaPagina()}:${turno}`]; return m && m.v ? m.v : null; };
function munDetHtml(k) {
  const v = munDados(), r = v && k && v.municipios[k];
  if (!r) return '<span class="cap">Toque num quadrado para ver o município.</span>';
  return detHtml(r.nome, r, true).replace("selecionado", k === foco.mun ? "selecionado" : "visualizando");
}

function cardMunicipios(d) {
  const u = uf || "RN", v = munDados(), E = ESTADOS[u] || u;
  const cargo = cargoDaPagina();
  let corpo = '<div class="skel"></div>', leg = "", n = 0;
  if (v) {
    const itens = Object.entries(v.municipios).map(([k, r]) => ({k, r, c: r.cands, pp: r.cands.length > 1 ? r.cands[0].pct - r.cands[1].pct : 0})).filter(x => x.c.length);
    n = itens.length;
    const grupos = {};
    itens.forEach(x => (grupos[x.c[0].sg] = grupos[x.c[0].sg] || []).push(x));
    const ordem = Object.entries(grupos).sort((p, q) => q[1].length - p[1].length);
    leg = ordem.map(([sg, xs]) => chipN(sg, xs.length)).join("");
    if (munModo === "grade") {
      corpo = `<div class="mgrid" id="mgrid">${ordem.flatMap(([, xs]) => xs.sort((p, q) => q.pp - p.pp)).map(x => {
        const g = degrau(x.c[0].sg, x.pp);
        return `<button class="cel${foco.mun === x.k ? " sel" : ""}" data-mun="${x.k}" tabindex="-1" style="background:${g.bg}" aria-label="${esc(x.r.nome)}: ${esc(nome(x.c[0].nome))} na frente por ${pp2(x.pp)} pontos percentuais"></button>`; }).join("")}</div>`;
    } else {
      const g = geoCache["/geo/uf/" + u];
      corpo = g && g.v ? svgMapa("uf", g.v, f => f.properties.codarea, v.municipios, (f, k) => `${v.municipios[k] ? v.municipios[k].nome : k} — ${CARGOS[cargo]}`, false, "duelo") : '<div class="skel"></div>';
    }
  }
  const modoTxt = v && v.modo === "2t" ? "no 2º turno" : "no 1º turno";
  return `<section class="mcard" id="mun-card"><div class="mhead"><div><h2>${esc(E)} por município</h2>
      <span class="sub">${n || "…"} municípios. ${munModo === "grade" ? "Cada quadrado é um município, agrupado por quem liderou e ordenado pela vantagem." : "Quem teve mais votos entre os dois finalistas " + modoTxt + "."}</span></div>
      <div class="seg2" role="group" aria-label="Modo de exibição"><button data-mm="grade" class="${munModo === "grade" ? "on" : ""}">Grade</button><button data-mm="mapa" class="${munModo === "mapa" ? "on" : ""}">Mapa</button></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${leg}</div>${corpo}
    <div class="detbox" id="det-mun">${munDetHtml(foco.mun)}</div>
    <div class="mfoot"><span>Cores em 3 degraus de vantagem: até 5 p.p., 5 a 15, mais de 15. Toque num quadrado para ver o município.</span><span>${n} de ${v ? v.total : "…"} com dados</span></div></section>`;
}

function pgResumo2(d) {
  const u = d.uf || {}, ao = d.pres && d.pres.ao_vivo, E = ESTADOS[u.sigla] || u.sigla;
  const gov = u.em_2turno ? cardDuelo("Governador", E, u.gov, "governador") : cardUfSemT2(d);
  const sub = ao ? "Apuração em andamento. Ordem fixa, alfabética."
    : (u.em_2turno ? `Presidente e governador de ${E}. Abaixo, como cada finalista foi no 1º turno.` : "Presidente. Abaixo, como cada finalista foi no 1º turno.");
  return avisoSim(d) + blocoTitulo(ao ? "2º turno · apuração" : "2º turno", sub, d) +
    `<div class="g2">${cardDuelo("Presidente da República", "Brasil", d.pres, "presidente")}${gov}</div>
    <div class="sec"><h2>O que está em disputa</h2></div>
    <div class="g2">${cardDisputa("Brasil", d.pres)}${u.em_2turno ? cardDisputa(u.sigla, u.gov) : ""}</div>`;
}
function pgPresidente2(d) {
  garantirMapas("1");
  const ao = d.pres && d.pres.ao_vivo;
  return avisoSim(d) + blocoTitulo("Presidente da República", `Duelo nacional, o que está em disputa e o mapa do ${ao ? "2º" : "1º"} turno.`, d) +
    `<div class="g2">${cardDuelo("Presidente da República", "Brasil", d.pres)}${cardDisputa("Brasil", d.pres)}</div>${cardCartograma(d)}${cardMunicipios(d)}`;
}
function pgGovernador2(d) {
  const u = d.uf || {}, ao = u.gov && u.gov.ao_vivo, E = ESTADOS[u.sigla] || u.sigla;
  if (!u.em_2turno) return avisoSim(d) + blocoTitulo("Governador", `O governo de ${E} foi decidido no 1º turno.`, d) + cardUfSemT2(d);
  garantirMapas("3");
  return avisoSim(d) + blocoTitulo("Governador · " + E, `Duelo no seu estado e o mapa do ${ao ? "2º" : "1º"} turno por município.`, d) +
    `<div class="g2">${cardDuelo("Governador", E, u.gov)}${cardDisputa(u.sigla, u.gov)}</div>${cardMunicipios(d)}`;
}

/* ---- desenho ---- */
const setHtml = (el, h) => { if (el && el._h !== h) { el.innerHTML = h; el._h = h; return true; } return false; };   // não recria nós se nada mudou
function rodape() {
  const t2 = turno === 2;
  setHtml($("#rodape"), `<div class="topo">${t2 ? `<a class="link" href="${hashDe("resumo", uf, 1)}">Resultado final do 1º turno →</a>` : `<a class="link" href="${hashDe("resumo", uf, 2)}">← Voltar ao 2º turno</a>`}
    <span><strong>Painel não oficial.</strong> Fonte: divulgação oficial de resultados do TSE. O resultado oficial é o que o TSE marcar como eleito. ${t2 ? "A ordem dos candidatos é alfabética e não muda com o placar."
      : "<strong>Como ler:</strong> ★ eleito (confirmado pelo TSE) · ② vai ao 2º turno (confirmado pelo TSE) · ▶ se elegeria com os votos de agora. Projeções de deputados são estimativas próprias (quociente eleitoral, cláusulas de 80%/20% e sobras)."}</span>
    <button class="tm" id="tema2">Alternar tema claro/escuro</button></div>`);
}
function desenharMenu() {
  const pgs = paginasAtuais(), nav = $("#nav");
  nav.style.setProperty("--n", pgs.length);
  setHtml(nav, pgs.map(([id, n]) => `<a href="${hashDe(id)}" ${pag === id ? 'aria-current="page"' : ""}>${n}</a>`).join(""));
  setHtml($("#turnos"), [[2, "2º turno", "2º"], [1, "1º turno", "1º"]].map(([t, n, c]) =>
    `<a href="${hashDe(pag, uf, t)}" ${turno === t ? 'aria-current="true"' : ""}><span class="t-l">${n}</span><span class="t-c">${c}</span></a>`).join(""));
  rodape();
}
function desenhar() {
  desenharMenu();
  atualizarCtx();
  if (!ultimo || ultimo.turno !== turno) return;
  anterior = atual; atual = {};
  const f = (turno === 2 ? {resumo: pgResumo2, presidente: pgPresidente2, governador: pgGovernador2}
                         : {resumo: pgResumo, presidente: pgPresidente, governador: pgGovernador, senado: pgSenado, deputados: pgDeputados})[pag] || pgResumo;
  // os links internos das páginas do 1º turno não carregam o turno: acrescenta aqui
  const html = f(ultimo).replace(/href="#\/(\w+)\/([A-Z]*)"/g, (m, p, u) => `href="${hashDe(p, u)}"`);
  const y = window.scrollY;
  if (setHtml($("#app"), html)) window.scrollTo({top: y, behavior: "instant"});     // troca de dados não pode jogar o usuário para o topo
}

/* ---- tema claro/escuro ---- */
const temaEfetivo = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function alternarTema() {
  const t = temaEfetivo() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("tema", t); } catch (e) {}
}

/* ---- interação ---- */
function previewUf(x) {
  foco.uf = x;
  const el = $("#det-uf");
  if (el && ultimo) el.innerHTML = detUfHtml(ultimo, x || uf);
}
function previewMun(k, fixar) {
  if (fixar) {
    foco.mun = k;
    document.querySelectorAll(".cel.sel").forEach(e => e.classList.remove("sel"));
    const c = document.querySelector(`.cel[data-mun="${k}"]`); if (c) c.classList.add("sel");
  }
  const el = $("#det-mun");
  if (el) el.innerHTML = munDetHtml(k || foco.mun);
}
document.addEventListener("mousemove", e => {
  const t = $("#tip"), p = e.target.closest && e.target.closest("path[data-k]");
  if (!p) { t.style.display = "none"; return; }
  t.innerHTML = (tips[p.dataset.m] || {})[p.dataset.k] || "";
  t.style.display = "block";
  t.style.left = Math.min(e.clientX + 14, innerWidth - 290) + "px"; t.style.top = Math.min(e.clientY + 14, innerHeight - 140) + "px";
});
const sobre = e => {
  const c = e.target.closest && e.target.closest("[data-cg]"); if (c) previewUf(c.dataset.cg);
  const m = e.target.closest && e.target.closest("[data-mun]"); if (m) previewMun(m.dataset.mun, false);
};
document.addEventListener("mouseover", sobre);
document.addEventListener("focusin", sobre);
document.addEventListener("mouseout", e => {
  const c = e.target.closest && e.target.closest("#cartog");
  if (c && !c.contains(e.relatedTarget)) previewUf(null);
  const g = e.target.closest && e.target.closest("#mgrid");
  if (g && !g.contains(e.relatedTarget)) previewMun(foco.mun, false);
});
document.addEventListener("click", e => {
  const t = e.target;
  if (!t.closest) return;
  // chat
  if (t.closest("#cw-fab")) { abrirChat(true); return; }
  if (t.closest("#cw-fechar") || t.closest("#cw-scrim")) { abrirChat(false); return; }
  const sug = t.closest("[data-sug]");
  if (sug) { enviarPergunta(sug.dataset.sug); return; }
  if (t.closest("#chat-enviar")) { const ta = $("#chat-texto"); const v = ta.value; ta.value = ""; enviarPergunta(v); return; }
  if (t.closest("#cw-novo")) { if (!chat.ocupado) { chat.id = null; chat.msgs = []; renderMsgs(); } return; }
  const re = t.closest("[data-retry]");
  if (re) { const i = +re.dataset.retry, u = chat.msgs[i - 1]; if (u && !chat.ocupado) { chat.msgs.splice(i, 1); enviarPergunta(u.texto, true); } return; }
  const ref = t.closest("button.ref");
  if (ref) {
    const msg = ref.closest(".msg"), d = msg && msg.querySelector(`details[id$="-${ref.dataset.ref}"]`);
    if (d) { d.open = true; d.scrollIntoView({behavior: "smooth", block: "nearest"}); }
    return;
  }
  // tema
  if (t.closest("#tema") || t.closest("#tema2")) { alternarTema(); return; }
  // 2º turno: cartograma, grade de municípios, modo
  const cg = t.closest("[data-cg]");
  if (cg) { irPara(pag, cg.dataset.cg); return; }
  const mm = t.closest("[data-mm]");
  if (mm) { munModo = mm.dataset.mm; $("#app")._h = null; desenhar(); return; }
  const cel = t.closest("[data-mun]");
  if (cel) { previewMun(cel.dataset.mun, true); return; }
  if (t.closest("[data-ir-mun]")) { const c = $("#mun-card"); if (c) c.scrollIntoView({behavior: "smooth", block: "start"}); return; }
  const pm = t.closest('path[data-m="uf"]');
  if (pm && $("#det-mun")) { previewMun(pm.dataset.k, true); return; }
  // 1º turno
  const dep = t.closest("[data-dep]");
  if (dep) { depTipo = dep.dataset.dep; desenhar(); return; }
  const lin = t.closest(".linha[data-uf]");
  if (lin) { irPara(pag, lin.dataset.uf); return; }
  const p = t.closest('path.clic[data-m="br"]');
  if (p && ESTADOS[p.dataset.k]) irPara(pag, p.dataset.k);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#cw") && $("#cw").dataset.aberto === "1") { abrirChat(false); return; }
  if (e.target && e.target.id === "chat-texto" && e.key === "Enter" && !e.shiftKey) {
    e.preventDefault(); const v = e.target.value; e.target.value = ""; enviarPergunta(v); return;
  }
  if (e.key === "Enter" && e.target.matches && e.target.matches(".linha[data-uf]")) irPara(pag, e.target.dataset.uf);
});
document.addEventListener("input", e => { if (e.target && e.target.id === "chat-texto") atualizarEntrada(); });

function atualizarUfPill() {
  const u = uf || "";
  $("#sel-uf").value = u;
  $("#uf-l").textContent = u ? `${u} · ${ESTADOS[u] || u}` : "—";
  $("#uf-c").textContent = u || "—";
}
$("#sel-uf").innerHTML = Object.entries(ESTADOS).map(([s, n]) => `<option value="${s}">${s} · ${n}</option>`).join("");
$("#sel-uf").onchange = () => irPara(pag, $("#sel-uf").value);

async function carregar() {
  try {
    const r = await fetch(`/api?uf=${uf || ""}&turno=${turno}&t=${Date.now()}`);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (j.turno !== turno || (uf && j.uf && j.uf.sigla !== uf)) return;        // resposta de uma escolha anterior
    ultimo = j;
    if (!uf && ultimo.uf) { uf = ultimo.uf.sigla; try { localStorage.setItem("uf", uf); } catch (e) {} }
    atualizarUfPill();
    const ao = ultimo.turno === 2 && ultimo.pres && ultimo.pres.ao_vivo;
    const txt = (ao ? "ao vivo · " : "atualizado às ") + ultimo.agora;
    $("#dot").classList.remove("off");
    $("#dot").setAttribute("aria-label", txt);
    $("#status").textContent = txt;
    desenhar();
  } catch (e) {
    $("#dot").classList.add("off");
    const msg = location.protocol === "file:" ? "abra pelo iniciar.bat (http://localhost:8765)"
      : "servidor local parado — mantenha a janela do iniciar.bat aberta";
    $("#status").textContent = msg;
    $("#dot").setAttribute("aria-label", msg);
    $("#status").style.display = "inline";
  }
}

montarWidget(); sincronizar(); desenharMenu(); carregar(); setInterval(carregar, 10000);
</script>
</body>
</html>
